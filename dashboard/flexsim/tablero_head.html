<style>
html{height:100%}body{height:100%;overflow-x:hidden;margin:0;background:#f4f7fc;color:#0f1b2d;font-family:"Segoe UI",system-ui,sans-serif;font-size:13px}
.pt{padding:12px 32px 18px 14px;background:#f4f7fc;min-height:100%;box-sizing:border-box}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-bottom:10px}
.tt{font-size:17px;font-weight:800;letter-spacing:-.01em}.tt span{font-size:12px;font-weight:600;color:#5b6b82;margin-left:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-left:auto;flex:1 1 440px}
.k{background:#fff;border:1px solid #dfe6f1;border-radius:12px;padding:6px 12px;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.k b{order:1;display:block;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}.k span{order:2;font-size:11px;color:#5b6b82}.sp{order:3;display:block;width:100%;height:24px;margin-top:5px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tab{flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;user-select:none;padding:6px 14px;border-radius:999px;background:#fff;border:1px solid #dfe6f1;font-weight:700;color:#33455f}
.tab:hover{background:#eaf0fa}.ab{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;margin-left:10px;vertical-align:middle;font-size:8px;font-style:normal;padding-left:1px;cursor:pointer;user-select:none;background:#fff;border:1px solid #dfe6f1;color:#33455f}.ab:hover{background:#eaf0fa}.ab.on{background:#1f6feb;border-color:#1f6feb;color:#fff}.tab.on{background:#1f6feb;border-color:#1f6feb;color:#fff}
.hoja{display:none}.hoja.on{display:block}
.grid{display:block;column-width:440px;column-gap:12px}
.card{background:#fff;border:1px solid #dfe6f1;border-radius:16px;padding:12px 14px;box-shadow:0 1px 2px rgba(15,27,45,.04)}
.ct{font-size:14px;font-weight:800;margin-bottom:6px}.u{font-size:11px;font-weight:600;color:#5b6b82;margin-left:4px}
.card svg{width:100%;height:auto;display:block}
.gr{stroke:#e8edf5;stroke-width:1}.ay{fill:#7a889c;font-size:12px}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;margin:4px 0 2px;font-size:12px;color:#33455f}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.bars{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.br{display:grid;grid-template-columns:150px 1fr 112px;align-items:center;gap:8px;font-size:12px}
.bn{color:#33455f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{height:14px;background:#eef2f8;border-radius:4px;overflow:hidden;display:flex}.bt span{display:block;height:100%}
.bv{font-weight:700;font-variant-numeric:tabular-nums}.bv em{font-style:normal;font-weight:500;color:#7a889c;margin-left:4px}
.nota{margin-top:8px;font-size:11px;color:#5b6b82}.vacio{padding:30px 0;text-align:center;color:#7a889c}
@media (max-width:700px){
.pt{padding:10px 104px 16px 10px}
.top{flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:8px}
.tt{font-size:15px}.tt span{display:block;margin:2px 0 0}
.kpis{grid-template-columns:repeat(3,1fr);gap:6px;margin-left:0;flex:none}
.k{padding:6px 10px}.k b{font-size:16px}
.tabs{gap:5px;margin-bottom:10px}
.tab{padding:6px 11px;font-size:12px}
.grid{gap:10px}
.card{border-radius:14px;padding:10px 11px}
.ct{font-size:13px}
.ay{font-size:17px}.gr{stroke-width:1.4}
.lg{font-size:11px;gap:3px 10px}
.br{grid-template-columns:minmax(0,104px) 1fr auto;gap:6px;font-size:11px}
.bv em{display:block;margin-left:0;font-size:10px}
}
