<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      font-family: "SF Pro Display", sans-serif;
      pointer-events: none;
    }
    #k-box {
      position: absolute;
      left: 210px;
      bottom: 58px;
      width: 1500px;
      text-align: center;
      opacity: 0;
    }
    #k-txt {
      display: inline-block;
      padding: 10px 28px;
      border-radius: 16px;
      background: rgba(5, 5, 7, 0.86);
      color: #ffffff;
      font-size: 34px;
      font-weight: 700;
      line-height: 1.2;
    }
    /* barrido horizontal continuo: cada palabra se rellena de izquierda a derecha con un degradé de corte firme */
    #k-txt .w {
      color: transparent;
      -webkit-text-fill-color: transparent;
      background-image: linear-gradient(90deg, #ffffff 0%, #ffffff 100%);
      -webkit-background-clip: text;
      background-clip: text;
    }
  </style>
  <div id="root" data-composition-id="s06-karaoke" data-width="1920" data-height="1080">
    <div id="k-box" data-layout-ignore><span id="k-txt"></span></div>
  </div>
  <script>
    // Karaoke de la toma de FlexSim (e1_tablero_ciclo.mp4, 56 s a velocidad normal): un ciclo de las 7 hojas del tablero, 8 s cada una
    // (Producción, Colas y WIP, Paradas, Velocidad, Balance de masa, Montacargas, Estadística). Tiempos en segundos de la toma.
    // Datos: SUPUESTOS_v2.md (batch de 7 cargas = 1050 kg, P4 montacargas), notas del propio tablero PATY_Tablero y E1_FINAL.md (transitorio ≈ 4 h).
    (function () {
      const HOST = 164.533333; // tiempo global = HOST + segundo de la toma
      const SEGS = [
        [0.4, 7.6, "La planta en FlexSim y, al costado, nuestro tablero: pallets terminados contra la meta del programa."],
        [8.4, 15.6, "Después, dónde se acumula el material: cámaras, colas y lo que hay en proceso. Ahí se forma la fila."],
        [16.4, 23.6, "Las máquinas también se rompen: cuántas veces se paró cada equipo y por cuánto tiempo, con datos reales."],
        [24.4, 31.6, "En velocidad, los kilos por hora: la formadora tiene 982 de capacidad, contra 1843 del estándar."],
        [32.4, 39.6, "El balance de masa cuida las cuentas: un batch son mil cincuenta kilos, siete cargas."],
        [40.4, 47.6, "Cada montacargas tiene su cuenta de traslados: son cuatro, de la recepción a la expedición."],
        [48.4, 55.6, "Y las estadísticas: calentamiento de cuatro horas y ocupación de cada estación."],
      ].map((s) => ({ t0: HOST + s[0], t1: HOST + s[1], text: s[2] }));

      const box = document.getElementById("k-box");
      const txt = document.getElementById("k-txt");
      let cur = null, spans = [], widths = [], total = 1;
      function renderAt(t) {
        const s = SEGS.find((x) => t >= x.t0 && t < x.t1);
        if (!s) { box.style.opacity = 0; cur = null; return; }
        box.style.opacity = 1;
        if (cur !== s) {
          cur = s;
          txt.innerHTML = s.text.split(" ").map((w) => '<span class="w">' + w + "</span>").join(" ");
          spans = Array.prototype.slice.call(txt.querySelectorAll(".w"));
          widths = spans.map((sp) => sp.getBoundingClientRect().width + 8); // + el espacio entre palabras
          total = widths.reduce((a, b) => a + b, 0);
        }
        // avance 0..1 sobre el 85 % de la frase, medido en píxeles de texto, en el orden de lectura
        const target = Math.min(1, (t - s.t0) / ((s.t1 - s.t0) * 0.85)) * total;
        let acc = 0;
        for (let i = 0; i < spans.length; i++) {
          const f = Math.max(0, Math.min(1, (target - acc) / (widths[i] - 8)));
          const pc = (f * 100).toFixed(1);
          spans[i].style.backgroundImage = "linear-gradient(90deg, #ff4d63 0%, #ff4d63 " + pc + "%, #ffffff " + pc + "%, #ffffff 100%)";
          acc += widths[i];
        }
      }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(0);
      window.__timelines["s06-karaoke"] = gsap.timeline({ paused: true });
    })();
  </script>
</template>
