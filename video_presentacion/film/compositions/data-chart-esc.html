<!-- hyperframes-registry-item: data-chart-esc -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Data Chart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Libre+Franklin:wght@300;400;600&display=block"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #faf9f6;
      }
    </style>
  </head>
  <body>
    <div
      id="data-chart-esc"
      data-composition-id="data-chart-esc"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="15"
    >
      <div class="chart-container">
        <!-- Header Section -->
        <div class="header">
          <h1 class="headline">Producción por escenario: pallets y toneladas por día</h1>
          <p class="subtitle">Promedio de 10 réplicas de 24 h · L7 + L8</p>
          <div class="key">
            <div class="key-item">
              <div class="key-box revenue-box"></div>
              <span class="key-text">Pallets por día</span>
            </div>
            <div class="key-item">
              <div class="key-line conversion-line"></div>
              <span class="key-text">Toneladas por día</span>
            </div>
          </div>
        </div>

        <!-- SVG Chart Area -->
        <svg class="chart-svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid meet">
          <!-- Gridlines Group -->
          <g class="gridlines"></g>

          <!-- X-Axis Labels -->
          <g class="x-axis-labels"></g>

          <!-- Bars Group (Revenue) -->
          <g class="bars-group"></g>

          <!-- Bar Labels Group -->
          <g class="bar-labels-group"></g>

          <!-- Line Group (Conversion Rate) -->
          <g class="line-group">
            <path class="conversion-path" fill="none" stroke="#050507" stroke-width="1.5" />
            <circle class="line-dot" r="5" fill="#050507" style="opacity: 0" />
          </g>

          <!-- Line Labels Group -->
          <g class="line-labels-group"></g>

          <!-- Baseline -->
          <line x1="100" y1="600" x2="1500" y2="600" stroke="black" stroke-width="1" />
        </svg>

        <!-- Source Line -->
        <div class="source">Fuente: modelo de FlexSim · intervalos de confianza del 95 % (t de Student, 9 g. l.)</div>
      </div>

      <style>
        [data-composition-id="data-chart-esc"] {
          width: 1920px;
          height: 1080px;
          background-color: #faf9f6;
          font-family: "Libre Franklin", sans-serif;
          color: #333;
          display: flex;
          justify-content: center;
          align-items: center;
          overflow: hidden;
        }

        [data-composition-id="data-chart-esc"] .chart-container {
          width: 1600px;
          height: 900px;
          display: flex;
          flex-direction: column;
          position: relative;
          transform: scale(1.15);
          transform-origin: center center;
        }

        [data-composition-id="data-chart-esc"] .header {
          margin-bottom: 40px;
          text-align: left;
        }

        [data-composition-id="data-chart-esc"] .headline {
          font-family: "Libre Baskerville", serif;
          font-size: 42px;
          margin: 0;
          padding: 0;
          clip-path: inset(0 100% 0 0);
          white-space: nowrap;
        }

        [data-composition-id="data-chart-esc"] .subtitle {
          font-size: 16px;
          color: #666;
          margin: 8px 0 16px 0;
          clip-path: inset(0 100% 0 0);
          white-space: nowrap;
        }

        [data-composition-id="data-chart-esc"] .key {
          display: flex;
          gap: 24px;
          opacity: 0;
        }

        [data-composition-id="data-chart-esc"] .key-item {
          display: flex;
          align-items: center;
          gap: 8px;
        }

        [data-composition-id="data-chart-esc"] .key-box {
          width: 10px;
          height: 10px;
          background-color: #ff1f3d;
        }

        [data-composition-id="data-chart-esc"] .key-line {
          width: 16px;
          height: 1.5px;
          background-color: #050507;
        }

        [data-composition-id="data-chart-esc"] .key-text {
          font-size: 13px;
          color: #666;
        }

        [data-composition-id="data-chart-esc"] .chart-svg {
          width: 100%;
          height: 600px;
          overflow: visible;
        }

        [data-composition-id="data-chart-esc"] .source {
          position: absolute;
          bottom: 0;
          left: 0;
          font-size: 11px;
          color: #999;
          opacity: 0;
        }

        [data-composition-id="data-chart-esc"] .grid-line {
          stroke: #e8e8e8;
          stroke-width: 0.5px;
          opacity: 0;
        }

        [data-composition-id="data-chart-esc"] .axis-label {
          font-size: 14px;
          fill: #666;
          text-anchor: middle;
        }

        [data-composition-id="data-chart-esc"] .bar {
          fill: #ff1f3d;
        }

        [data-composition-id="data-chart-esc"] .bar-label {
          font-size: 14px;
          fill: #333;
          text-anchor: middle;
          opacity: 0;
        }

        [data-composition-id="data-chart-esc"] .line-label {
          font-size: 14px;
          fill: #050507;
          font-weight: 600;
          text-anchor: middle;
          opacity: 0;
        }

        [data-composition-id="data-chart-esc"] .headline { font-size: 78px !important; }
        [data-composition-id="data-chart-esc"] .subtitle { font-size: 36px !important; }
        [data-composition-id="data-chart-esc"] .key-text { font-size: 32px !important; }
        [data-composition-id="data-chart-esc"] .axis-label { font-size: 30px !important; font-weight: 600; }
        [data-composition-id="data-chart-esc"] .bar-label { font-size: 34px !important; font-weight: 700; }
        [data-composition-id="data-chart-esc"] .line-label { font-size: 30px !important; font-weight: 700; }
        [data-composition-id="data-chart-esc"] .source { font-size: 26px !important; }
      </style>

      <script>
        (function () {
          const svg = document.querySelector('[data-composition-id="data-chart-esc"] .chart-svg');
          const tl = gsap.timeline({ paused: true });

          // Data
          const months = ["E1 · Base", "E2 · Formadoras", "E3 · +1,5× MP", "E4 · Batch 1200 kg"];
          const revenueData = [49.1, 58.4, 62.0, 49.7];
          const conversionData = [42.5, 50.4, 53.5, 42.9];

          // Chart Dimensions
          const chartWidth = 1400;
          const chartHeight = 500;
          const startX = 100;
          const startY = 600;
          const barWidth = 170;
          const spacing = (chartWidth - barWidth * months.length) / (months.length + 1);

          // Scales
          const maxRevenue = 75;
          const maxConversion = 75;

          const getBarY = (val) => startY - (val / maxRevenue) * chartHeight;
          const getLineY = (val) => startY - (val / maxConversion) * chartHeight;
          const getX = (i) => startX + spacing + i * (barWidth + spacing) + barWidth / 2;

          // Setup Elements
          const gridGroup = svg.querySelector(".gridlines");
          const xAxisGroup = svg.querySelector(".x-axis-labels");
          const barsGroup = svg.querySelector(".bars-group");
          const barLabelsGroup = svg.querySelector(".bar-labels-group");
          const lineLabelsGroup = svg.querySelector(".line-labels-group");
          const conversionPath = svg.querySelector(".conversion-path");
          const lineDot = svg.querySelector(".line-dot");

          // Create Gridlines
          for (let i = 1; i <= 5; i++) {
            const y = startY - i * (chartHeight / 5);
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", startX);
            line.setAttribute("y1", y);
            line.setAttribute("x2", startX + chartWidth);
            line.setAttribute("y2", y);
            line.setAttribute("class", "grid-line");
            gridGroup.appendChild(line);
          }

          // Create X-Axis Labels & Bars & Bar Labels
          const linePoints = [];
          months.forEach((month, i) => {
            const x = getX(i);

            const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
            label.setAttribute("x", x);
            label.setAttribute("y", startY + 30);
            label.setAttribute("class", "axis-label");
            label.textContent = month;
            xAxisGroup.appendChild(label);

            const barHeight = (revenueData[i] / maxRevenue) * chartHeight;
            const bar = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            bar.setAttribute("x", x - barWidth / 2);
            bar.setAttribute("y", startY);
            bar.setAttribute("width", barWidth);
            bar.setAttribute("height", 0);
            bar.setAttribute("class", "bar");
            barsGroup.appendChild(bar);

            const barLabel = document.createElementNS("http://www.w3.org/2000/svg", "text");
            barLabel.setAttribute("x", x);
            barLabel.setAttribute("y", getBarY(revenueData[i]) - 10);
            barLabel.setAttribute("class", "bar-label");
            barLabel.textContent = String(revenueData[i].toFixed(1)).replace('.', ',');
            barLabelsGroup.appendChild(barLabel);

            linePoints.push(`${x},${getLineY(conversionData[i])}`);

            const lineLabel = document.createElementNS("http://www.w3.org/2000/svg", "text");
            lineLabel.setAttribute("x", x);
            lineLabel.setAttribute("y", getLineY(conversionData[i]) - 15);
            lineLabel.setAttribute("class", "line-label");
            lineLabel.textContent = String(conversionData[i].toFixed(1)).replace('.', ',') + ' t';
            lineLabelsGroup.appendChild(lineLabel);
          });

          // Set Path Data
          conversionPath.setAttribute("d", `M ${linePoints.join(" L ")}`);
          const pathLength = conversionPath.getTotalLength();
          conversionPath.style.strokeDasharray = pathLength;
          conversionPath.style.strokeDashoffset = pathLength;

          // --- ANIMATION TIMELINE ---

          tl.to(
            '[data-composition-id="data-chart-esc"] .headline',
            {
              clipPath: "inset(0 0% 0 0)",
              duration: 1.2,
              ease: "power1.inOut",
            },
            0,
          );

          tl.to(
            '[data-composition-id="data-chart-esc"] .subtitle',
            {
              clipPath: "inset(0 0% 0 0)",
              duration: 1.2,
              ease: "power1.inOut",
            },
            0.2,
          );

          tl.to(
            '[data-composition-id="data-chart-esc"] .key',
            {
              opacity: 1,
              duration: 0.4,
              ease: "power2.out",
            },
            1.0,
          );

          tl.to(
            '[data-composition-id="data-chart-esc"] .grid-line',
            {
              opacity: 1,
              duration: 0.5,
              stagger: 0.25,
              ease: "power2.out",
            },
            0.5,
          );

          // Bars
          const bars = barsGroup.querySelectorAll(".bar");
          const barLabels = barLabelsGroup.querySelectorAll(".bar-label");

          bars.forEach((bar, i) => {
            const barHeight = (revenueData[i] / maxRevenue) * chartHeight;
            const startTime = 1.5 + i * 0.5;

            tl.to(
              bar,
              {
                attr: { height: barHeight, y: startY - barHeight },
                duration: 0.8,
                ease: "power2.out",
              },
              startTime,
            );

            tl.to(
              barLabels[i],
              {
                opacity: 1,
                duration: 0.3,
                ease: "power2.out",
              },
              startTime + 0.8,
            );
          });

          // Line
          const lastBarStartTime = 1.5 + (months.length - 1) * 0.5;
          const lineStartTime = lastBarStartTime + 0.5;

          tl.to(
            conversionPath,
            {
              strokeDashoffset: 0,
              duration: 3,
              ease: "none",
            },
            lineStartTime,
          );

          // Line Dot & Labels
          tl.set(
            lineDot,
            {
              opacity: 1,
              attr: { cx: getX(0), cy: getLineY(conversionData[0]) },
            },
            lineStartTime,
          );

          const lineLabels = lineLabelsGroup.querySelectorAll(".line-label");
          months.forEach((_, i) => {
            if (i > 0) {
              const x = getX(i);
              const y = getLineY(conversionData[i]);
              tl.to(
                lineDot,
                {
                  attr: { cx: x, cy: y },
                  duration: 3 / (months.length - 1),
                  ease: "none",
                },
                lineStartTime + ((i - 1) / (months.length - 1)) * 3,
              );
            }

            const labelTime = lineStartTime + (i / (months.length - 1)) * 3 + 0.2;

            lineLabels[i].textContent = "0,0 t";

            tl.to(
              lineLabels[i],
              {
                opacity: 1,
                duration: 0.1,
                ease: "power2.out",
              },
              labelTime,
            );

            const dummy = { val: 0 };
            tl.to(
              dummy,
              {
                val: conversionData[i],
                duration: 0.8,
                ease: "power2.out",
                onUpdate: () => {
                  lineLabels[i].textContent = dummy.val.toFixed(1).replace(".", ",") + " t";
                },
              },
              labelTime,
            );
          });

          // Source Line
          tl.to(
            '[data-composition-id="data-chart-esc"] .source',
            {
              opacity: 1,
              duration: 0.5,
              ease: "power2.out",
            },
            ">+0.5",
          );

          window.__timelines = window.__timelines || {};
          window.__timelines["data-chart-esc"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
