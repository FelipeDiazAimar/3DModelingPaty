      (function () {
        const HOSTW = 333.323;
        const vt = document.getElementById("w8-sub-t");
        let cur = null, spans = [], widths = [], total = 1;
        function renderW(t) {
          const lt = t - HOSTW;
          const s = SUBS.find((x) => lt >= x.t0 && lt < x.t1 + 0.15);
          if (!s) { if (cur) { vt.textContent = ""; cur = null; } return; }
          if (cur !== s) {
            cur = s;
            vt.innerHTML = s.text.split(" ").map((w) => '<span class="w">' + w + "</span>").join(" ");
            spans = Array.prototype.slice.call(vt.querySelectorAll(".w"));
            widths = spans.map((sp) => sp.getBoundingClientRect().width + 8);
            total = widths.reduce((a, b) => a + b, 0);
          }
          const dur = s.dur || Math.min((s.t1 - s.t0) * 0.9, s.text.length / 14);
          const target = Math.min(1, (lt - s.t0) / Math.max(dur, 0.5)) * total;
          let acc = 0;
          for (let i = 0; i < spans.length; i++) {
            const f = Math.max(0, Math.min(1, (target - acc) / (widths[i] - 8)));
            const pc = (f * 100).toFixed(1);
            spans[i].style.backgroundImage = "linear-gradient(90deg, #ff4d63 0%, #ff4d63 " + pc + "%, #ffffff " + pc + "%, #ffffff 100%)";
            acc += widths[i];
          }
        }
        window.addEventListener("hf-seek", (e) => renderW(e.detail.time));
      })();
      window.__timelines["s08-web"] = tl;
