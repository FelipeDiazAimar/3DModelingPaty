  <div id="root" data-composition-id="s01-chispa" data-width="1920" data-height="1080">

      <div id="lp-b" class="s01-lpc"><svg viewBox="0 0 80 80"><path d="M0 0H40A40 40 0 0 1 80 40V80H0Z" fill="#ffffff" /></svg></div>
      <div id="lp-c" class="s01-lpc"><svg viewBox="0 0 80 80"><path d="M0 0H80V80H0Z" fill="#d0001f" /></svg></div>
      <div id="lp-d" class="s01-lpc"><svg viewBox="0 0 80 80"><path d="M0 0H80A40 40 0 0 1 40 40H0Z" fill="#ff4d63" /></svg></div>
      <div id="lp-e" class="s01-lpc"><svg viewBox="0 0 80 80"><path d="M0 0H80V80H0Z" fill="#ff1f3d" /></svg></div>

    <div id="s01-pill-row">

  <script>
    // Escena 1 · beats 0–8 · f0–112 · 128 BPM (1 beat = 0.46875 s)
    (function () {
      const B = 0.9375; // cada paso dura dos beats: el relato necesita 16 beats
      const FLOOD = 197 / 30; // b14 = f197
      const END = 225 / 30; // b16 = f225
      const DECRYPT = 2.6 * B;
      const SWEEP = 5 * B;

      const clamp = (x) => Math.min(1, Math.max(0, x));
      const seg = (t, a, b) => clamp((t - a) / (b - a));
      const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);

      const canvas = document.getElementById("s01-gl");
      const gl = canvas.getContext("webgl", { preserveDrawingBuffer: true, antialias: false });
      const VS = "attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}";
      const FS = `precision highp float;
        uniform vec2 R; uniform float T,LINE,OPEN,ORB,LOTE,LOTEA;
        float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
        float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
          return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
        float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p=p*2.03+vec2(17.,9.);a*=.5;}return v;}
        void main(){
          vec2 p=(gl_FragCoord.xy-.5*R)/R.y;
          float w=(fbm(vec2(p.x*1.6,T*.35))-.5)*.035*LINE;
          float y=p.y+w;
          float mask=LINE>0.?smoothstep(LINE,LINE-.22,abs(p.x)):0.;
          float core=mask*.0013/(abs(y)+.0013);
          float halo=mask*.028/(abs(y)+.05);
          float q=fbm(vec2(p.x*2.2+T*.22,y*1.4-T*.3));
          float rays=fbm(vec2(p.x*8.+q*2.6,T*.28));
          float spread=mix(.1,2.2,OPEN);
          float aur=exp(-abs(y)/spread)*pow(rays,2.2)*mask*2.6;
          float d=length(p);
          float orbCore=ORB*.011/(d+.011);
          float orb=orbCore+ORB*.26*exp(-d*5.5);
          float l=length(p-vec2(LOTE,-w));
          float head=LOTEA*.0055/(l+.0055);
          float tail=LOTEA*step(p.x,LOTE)*exp((p.x-LOTE)*5.)*.0016/(abs(y)+.0016);
          vec3 red=vec3(1.,.07,.17), deep=vec3(.42,.0,.05), white=vec3(1.,.93,.94);
          vec3 c=vec3(.012,.012,.018);
          c+=deep*aur*.9+red*(halo+aur*.55+orb);
          c+=white*(core*.85+head+tail+orbCore*.55);
          float O=OPEN*.85;
          float band=OPEN>0.?smoothstep(O,O-.22,abs(y)+(q-.5)*.14):0.;
          float folds=.5+.5*sin(p.x*3.4+p.y*2.1+q*7.+T*.8);
          vec3 silk=mix(vec3(.62,.0,.08),vec3(1.,.09,.2),folds)*(.78+.4*rays);
          c=mix(c,silk,band);
          c=c/(1.+max(max(c.r,c.g),c.b)*.12);
          c+=(h(gl_FragCoord.xy)-.5)/255.;
          gl_FragColor=vec4(c,1.);
        }`;
      function sh(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
        return s;
      }
      const pr = gl.createProgram();
      gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS));
      gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS));
      gl.linkProgram(pr);
      gl.useProgram(pr);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.bindAttribLocation(pr, 0, "a");
      gl.linkProgram(pr);
      gl.useProgram(pr);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
      const U = {};
      ["R", "T", "LINE", "OPEN", "ORB", "LOTE", "LOTEA"].forEach((k) => (U[k] = gl.getUniformLocation(pr, k)));
      gl.uniform2f(U.R, 1920, 1080);

      // Texto "decrypt": cada carácter se resuelve en orden; antes baraja con semilla fija
      const FINAL = document.getElementById("s01-ghost").textContent;
      const textEl = document.getElementById("s01-text");
      const GLYPHS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/#";
      const pick = (i, f) => {
        const x = Math.sin(i * 91.7 + f * 37.3) * 43758.5453;
        return GLYPHS[Math.floor((x - Math.floor(x)) * GLYPHS.length)];
      };

      function renderAt(t) {
        const pulse = t >= B ? Math.exp(-(t - B) * 7) * 1.6 : 0;
        const orb = (1 + pulse) * (1 - seg(t, 2 * B, 2.7 * B));
        const line = t < 2 * B ? 0 : 0.03 + 1.15 * inOut(seg(t, 2 * B, 3 * B));
        const open = inOut(seg(t, FLOOD, END));
        const lote = -0.889 + 1.778 * seg(t, 3 * B, FLOOD);
        const loteA = seg(t, 3 * B, 3.2 * B) * (1 - seg(t, FLOOD, FLOOD + 0.1));
        gl.uniform1f(U.T, t);
        gl.uniform1f(U.LINE, line);
        gl.uniform1f(U.OPEN, open);
        gl.uniform1f(U.ORB, orb);
        gl.uniform1f(U.LOTE, lote);
        gl.uniform1f(U.LOTEA, loteA);
        gl.drawArrays(gl.TRIANGLES, 0, 3);

        const frame = Math.floor(t * 30);
        let s = "";
        if (t >= DECRYPT) {
          const done = Math.floor((t - DECRYPT) / 0.04);
          for (let i = 0; i < FINAL.length; i++) {
            s += i < done || FINAL[i] === " " ? FINAL[i] : pick(i, frame);
          }
        }
        textEl.textContent = s;
        const sweep = seg(t, SWEEP, FLOOD);
        textEl.style.backgroundPosition = 100 - 100 * sweep + "% 0";
      }

      const tl = gsap.timeline({ paused: true });
      tl.fromTo(
        "#s01-pill",
        { opacity: 0, filter: "blur(10px)", y: 14 },
        { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.3, ease: "expo.out" },
        DECRYPT - 0.04,
      );
      tl.to("#s01-pill", { opacity: 0, filter: "blur(10px)", duration: 0.15, ease: "power2.in" }, FLOOD);

      // SVG: cada estación se dibuja justo antes de que llegue el lote y late cuando pasa
      document.querySelectorAll(".s01-st").forEach((st) => {
        const pass = 3 * B + (Number(st.dataset.x) / 1920) * (FLOOD - 3 * B);
        tl.fromTo(
          st.querySelectorAll(".s01-d"),
          { strokeDashoffset: 1 },
          { strokeDashoffset: 0, duration: 0.3, ease: "power2.out", stagger: 0.03 },
          pass - 0.36,
        );
        tl.fromTo(
          st.querySelector(".s01-lbl"),
          { opacity: 0, filter: "blur(8px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" },
          pass - 0.3,
        );
      });
      tl.to("#s01-svg", { opacity: 0, filter: "blur(10px)", duration: 0.25, ease: "power2.in" }, 3.0);

      // Logo: cada pieza de la P cae desde una máquina a la cinta, viaja hasta el centro y sube a su lugar (cinco piezas, como en el cierre)
      const LINE_Y = 540, SZ = 80, RIDE = 0.75, FIN = 1.5;
      const pieces = [
        // id, x de salida, y de salida (bajo el ícono de la máquina), x destino, y destino, aparece, viaje
        ["lp-a", 300, 430, 900, 210, 3.15, 0.85],
        ["lp-b", 1620, 435, 1020, 210, 3.55, 0.85],
        ["lp-c", 760, 410, 900, 330, 4.0, 0.45],
        ["lp-d", 1160, 420, 1020, 330, 4.4, 0.45],
        ["lp-e", 120, 380, 900, 450, 4.9, 0.95],
      ];
      pieces.forEach(([id, x0, y0, xt, yt, at, ride]) => {
        const sel = "#" + id;
        const cy = LINE_Y - (SZ * RIDE) / 2;
        tl.set(sel, { x: x0 - SZ / 2, y: y0 - SZ / 2, scale: 0, opacity: 0 }, 0);
        tl.to(sel, { opacity: 1, scale: RIDE, duration: 0.18, ease: "back.out(2.2)" }, at);
        tl.to(sel, { y: cy - SZ / 2, duration: 0.3, ease: "bounce.out" }, at + 0.1);
        tl.to(sel, { x: xt - SZ / 2, duration: ride, ease: "power1.inOut" }, at + 0.42);
        tl.to(sel, { y: yt - SZ / 2, scale: FIN, duration: 0.5, ease: "back.out(1.5)" }, at + 0.42 + ride);
      });
      // destello al cerrar la P y latido
      const DONE = 4.9 + 0.42 + 0.95 + 0.5;
      tl.set("#s01-ring", { x: 960 - SZ / 2, y: 330 - SZ / 2, scale: 0.6, opacity: 0 }, 0);
      tl.fromTo("#s01-ring", { scale: 0.6, opacity: 0.9 }, { scale: 7, opacity: 0, duration: 0.7, ease: "power3.out" }, DONE - 0.05);
      tl.to("#s01-lp", { scale: 1.05, transformOrigin: "960px 330px", duration: 0.12, ease: "power2.out" }, DONE - 0.05);
      tl.to("#s01-lp", { scale: 1, duration: 0.4, ease: "back.out(2)" }, DONE + 0.07);
      // con la inundación roja las piezas pasan a negro y blanco, y la P crece
      tl.to(["#lp-a path", "#lp-c path", "#lp-e path"], { fill: "#050507", duration: 0.3, ease: "power2.inOut" }, FLOOD);
      tl.to(["#lp-b path", "#lp-d path"], { fill: "#ffffff", duration: 0.3, ease: "power2.inOut" }, FLOOD);
      tl.to("#s01-lp", { scale: 1.16, transformOrigin: "960px 330px", duration: END - FLOOD, ease: "power1.out" }, FLOOD);

      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(0);
      window.__timelines["s01-chispa"] = tl;
    })();
  </script>
